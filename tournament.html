<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enter the current Dragon Ball Legends tournament and pick your team." />
  <meta property="og:title" content="Tournament — DBL Tournaments" />
  <meta property="og:description" content="Enter the current Dragon Ball Legends tournament and pick your team." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#00e5ff" />
  <title>Tournament — DBL Tournaments</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/roster.css" />
  <link rel="stylesheet" href="css/bracket.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <style>
    .tournament-header {
      text-align: center;
      padding: 40px 0 30px;
    }

    .tournament-name {
      font-size: clamp(24px, 4vw, 36px);
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      margin-bottom: 8px;
    }

    .tournament-desc {
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto 20px;
      font-size: 14px;
    }

    .signup-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 24px;
    }

    .signup-form-panel {
      position: sticky;
      top: 80px;
      align-self: start;
    }

    .player-count {
      font-family: 'Exo 2', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .player-count span {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .signup-closed {
      text-align: center;
      padding: 60px 20px;
    }

    .signup-closed h2 {
      color: var(--pink);
      margin-bottom: 12px;
    }

    @media (max-width: 900px) {
      .signup-section {
        grid-template-columns: 1fr;
      }

      .signup-form-panel {
        position: static;
      }
    }

    @media (max-width: 480px) {
      .signup-section { padding: 0 4px; }
      .signup-form-panel { padding: 14px; }
      .signup-form-panel input,
      .signup-form-panel select,
      .signup-form-panel button { min-height: 44px; font-size: 16px; }
    }

    /* Power Rankings */
    .power-rankings {
      margin-top: 32px;
    }

    .power-rankings h3 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .power-rankings h3 .icon-fire {
      color: var(--pink);
    }

    .pr-round-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .pr-round-btn {
      padding: 6px 16px;
      font-family: 'Exo 2', sans-serif;
      font-size: 12px;
      font-weight: 700;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .pr-round-btn.active {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .pr-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .pr-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .pr-option:hover {
      border-color: var(--cyan);
    }

    .pr-option.voted {
      border-color: var(--pink);
      box-shadow: 0 0 12px rgba(255, 45, 120, 0.15);
    }

    .pr-option.my-vote {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
    }

    .pr-name {
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      min-width: 100px;
    }

    .pr-bar-bg {
      flex: 1;
      height: 24px;
      background: var(--bg-2);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .pr-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      transition: width 0.5s ease;
    }

    .pr-pct {
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      width: 50px;
      text-align: right;
      flex-shrink: 0;
    }

    .pr-feared {
      text-align: center;
      margin-top: 16px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--pink);
      border-radius: var(--radius);
      box-shadow: 0 0 20px rgba(255, 45, 120, 0.1);
    }

    .pr-feared__label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--pink);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pr-feared__name {
      font-family: 'Exo 2', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
    }
  </style>
</head>

  <div class="particles-bg" id="particles"></div>

  <main class="page container page-enter">
    <div id="tournament-content">
      <div class="loader"><div class="loader-spinner"></div></div>
    </div>
  </main>

  <!-- Character select modal -->
  <div class="modal-overlay" id="char-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Select Your Team</h3>
        <button class="modal-close" onclick="closeCharModal()">&times;</button>
      </div>
      <div class="team-display" id="modal-team-slots"></div>
      <div class="filter-bar" id="modal-filters"></div>
      <div class="char-grid" id="modal-char-grid"></div>
      <div style="text-align:center;margin-top:20px;">
        <button class="btn btn-primary" id="confirm-team-btn" disabled onclick="confirmTeam()">Confirm Team (0/3)</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/maintenance.js"></script>
  <script src="js/auth.js"></script>
    <script src="js/titles.js"></script>
    <script src="js/activity-alerts.js"></script>
    <script src="js/daily-rewards.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/particles.js"></script>
  <script>
    initParticles(document.getElementById('particles'));

    let currentTournament = null;
    let signups = [];

    // Season XP helper
    let _activeSeason = null;
    async function getActiveSeason() {
      if (!_activeSeason) _activeSeason = await db.getActiveSeason();
      return _activeSeason;
    }

    async function loadTournament() {
      const content = document.getElementById('tournament-content');

      try {
        currentTournament = await db.getActiveTournament();
      } catch (e) {
        currentTournament = null;
      }

      if (!currentTournament) {
        content.innerHTML = `
          <div class="signup-closed">
            <h2>No Active Tournament</h2>
            <p class="text-muted">Check back later or join the Discord for updates.</p>
            <a href="index.html" class="btn btn-secondary mt-3">Back to Home</a>
          </div>`;
        return;
      }

      try {
        signups = await db.getSignups(currentTournament.id);
      } catch (e) {
        signups = [];
      }

      await CharacterManager.load();
      if (currentTournament.theme) ThemeManager.apply(currentTournament.theme);
      if (currentTournament.allowed_characters) {
        CharacterManager.setAllowed(currentTournament.allowed_characters);
      }

      renderTournamentPage();

      // Realtime
      try {
        subscribeToChanges(currentTournament.id, {
          onSignup: async () => {
            signups = await db.getSignups(currentTournament.id);
            renderPlayerList();
            NotificationSystem.show('A new player has signed up!', 'signup');
          },
          onTournament: async (payload) => {
            currentTournament = payload.new;
            renderTournamentPage();
          }
        });
      } catch (e) {}
    }

    function renderTournamentPage() {
      const content = document.getElementById('tournament-content');
      const isSignup = currentTournament.status === 'signup';

      content.innerHTML = `
        <div class="tournament-header">
          <span class="status ${isSignup ? 'status-signup' : 'status-active'}">${isSignup ? 'Signups Open' : 'In Progress'}</span>
          <h1 class="tournament-name mt-2">${currentTournament.name}</h1>
          ${currentTournament.description ? `<p class="tournament-desc">${currentTournament.description}</p>` : ''}
          <div class="player-count mt-2">${signups.length} <span>/ ${currentTournament.max_players || '∞'} players</span></div>
          <div style="display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap;">
            <a href="bracket.html" class="btn btn-sm btn-secondary">Bracket</a>
            <a href="banpick.html" class="btn btn-sm btn-secondary">Ban Phase</a>
            <a href="draft.html" class="btn btn-sm btn-secondary">Draft Mode</a>
            <a href="fight-night.html" class="btn btn-sm btn-secondary">Fight Night</a>
          </div>
        </div>

        <div id="tournament-countdown"></div>

        ${isSignup ? `
        <div class="signup-section">
          <div>
            <h3 class="mb-2">Registered Players</h3>
            <div id="player-list" class="player-list stagger"></div>
          </div>
          <div class="signup-form-panel">
            <div class="card card-glow">
              <h3 class="mb-2">Sign Up</h3>
              <div class="flex flex-col gap-2">
                <label style="font-weight:600;font-size:0.9rem;">Discord Username</label>
                <input type="text" id="discord-input" placeholder="e.g. Player#1234" />
                <label style="font-weight:600;font-size:0.9rem;margin-top:8px;">Your Team</label>
                <div class="team-display" id="signup-team-slots"></div>
                <button class="btn btn-secondary" onclick="openCharModal()">Pick Characters</button>
                <button class="btn btn-primary btn-charge mt-2" id="signup-btn" onclick="submitSignup()" disabled>
                  Sign Up
                </button>
              </div>
            </div>
            ${currentTournament.allow_repick ? `
            <div class="card card-glow mt-3" style="border:1px solid var(--gold);">
              <h3 class="mb-2" style="color:var(--gold);">Change Team</h3>
              <p class="text-muted" style="font-size:12px;margin-bottom:10px;">Already signed up? Pick a new team below.</p>
              <div class="flex flex-col gap-2">
                <label style="font-weight:600;font-size:0.9rem;">Your Discord Username</label>
                <input type="text" id="repick-username" placeholder="e.g. Player#1234" />
                <label style="font-weight:600;font-size:0.9rem;margin-top:8px;">New Team</label>
                <div class="team-display" id="repick-team-slots"></div>
                <button class="btn btn-secondary" onclick="openRepickModal()">Pick Characters</button>
                <button class="btn btn-primary mt-2" id="repick-btn" onclick="submitRepick()" disabled>
                  Update Team
                </button>
              </div>
            </div>
            ` : ''}
          </div>
        </div>
        ` : `
        <div>
          <h3 class="mb-2">Players</h3>
          <div id="player-list" class="player-list stagger"></div>
          <div class="text-center mt-3">
            <a href="bracket.html" class="btn btn-primary btn-lg">View Bracket</a>
          </div>
        </div>
        ${currentTournament.allow_repick ? `
        <div class="card card-glow mt-3" style="border:1px solid var(--gold);max-width:500px;margin-left:auto;margin-right:auto;">
          <h3 class="mb-2" style="color:var(--gold);">Change Team</h3>
          <p class="text-muted" style="font-size:12px;margin-bottom:10px;">Team re-picks are open. Pick a new team below.</p>
          <div class="flex flex-col gap-2">
            <label style="font-weight:600;font-size:0.9rem;">Your Discord Username</label>
            <input type="text" id="repick-username" placeholder="e.g. Player#1234" />
            <label style="font-weight:600;font-size:0.9rem;margin-top:8px;">New Team</label>
            <div class="team-display" id="repick-team-slots"></div>
            <button class="btn btn-secondary" onclick="openRepickModal()">Pick Characters</button>
            <button class="btn btn-primary mt-2" id="repick-btn" onclick="submitRepick()" disabled>
              Update Team
            </button>
          </div>
        </div>
        ` : ''}
        <div class="power-rankings" id="power-rankings-section">
          <div class="card card-glow">
            <h3><span class="icon-fire">&#128293;</span> Power Rankings — Who Will Win?</h3>
            <div id="pr-round-selector" class="pr-round-selector"></div>
            <div id="pr-content">
              <div class="loader"><div class="loader-spinner"></div></div>
            </div>
          </div>
        </div>
        `}
      `;

      renderPlayerList();

      if (!isSignup) {
        initPowerRankings();
        if (currentTournament.allow_repick) {
          initRepickSlots();
        }
      }

      if (isSignup) {
        CharacterManager.renderTeamSlots(document.getElementById('signup-team-slots'));
        updateSignupBtn();

        CharacterManager.setTeamChangeHandler((team) => {
          CharacterManager.renderTeamSlots(document.getElementById('signup-team-slots'));
          updateSignupBtn();
        });

        if (currentTournament.allow_repick) {
          initRepickSlots();
        }

        // Countdown timer
        if (currentTournament.signup_deadline) {
          initCountdown(document.getElementById('tournament-countdown'), currentTournament.signup_deadline, 'Signups Close In');
        } else if (currentTournament.start_time) {
          initCountdown(document.getElementById('tournament-countdown'), currentTournament.start_time, 'Tournament Starts In');
        }
      }
    }

    function renderPlayerList() {
      const list = document.getElementById('player-list');
      if (!list) return;

      if (!signups.length) {
        list.innerHTML = '<div class="empty-state"><p>No players registered yet. Be the first!</p></div>';
        return;
      }

      list.innerHTML = signups.map((s, i) => {
        let teamHtml = '';
        if (currentTournament.teams_visible && s.team) {
          teamHtml = `<div class="player-team">${s.team.map(c =>
            `<a href="character.html?id=${c.id}" title="${c.name}"><img src="${c.image}" alt="${c.name}" onerror="this.style.display='none'" /></a>`
          ).join('')}</div>`;
        }

        return `
          <div class="player-row">
            <div class="player-info">
              <span class="player-number">${String(i + 1).padStart(2, '0')}</span>
              <a class="player-name" href="profile.html?player=${encodeURIComponent(s.discord_username)}">${s.discord_username}</a>
            </div>
            ${teamHtml}
          </div>`;
      }).join('');
    }

    function updateSignupBtn() {
      const btn = document.getElementById('signup-btn');
      if (!btn) return;
      const name = document.getElementById('discord-input')?.value.trim();
      const team = CharacterManager.getTeam();
      btn.disabled = !name || team.length !== 3;
    }

    // Character modal
    function openCharModal() {
      const modal = document.getElementById('char-modal');
      modal.classList.add('open');
      CharacterManager.renderFilterBar(
        document.getElementById('modal-filters'),
        document.getElementById('modal-char-grid'),
        { selectable: true, onSelect: onCharSelect }
      );
      CharacterManager.renderTeamSlots(document.getElementById('modal-team-slots'));
      updateConfirmBtn();
    }

    function closeCharModal() {
      document.getElementById('char-modal').classList.remove('open');
    }

    function onCharSelect(char, team) {
      CharacterManager.renderTeamSlots(document.getElementById('modal-team-slots'));
      updateConfirmBtn();
    }

    function updateConfirmBtn() {
      const btn = document.getElementById('confirm-team-btn');
      const team = CharacterManager.getTeam();
      btn.textContent = `Confirm Team (${team.length}/3)`;
      btn.disabled = team.length !== 3;
    }

    function confirmTeam() {
      closeCharModal();
      CharacterManager.renderTeamSlots(document.getElementById('signup-team-slots'));
      updateSignupBtn();
    }

    async function submitSignup() {
      const name = document.getElementById('discord-input').value.trim();
      const team = CharacterManager.getTeam();
      if (!name || team.length !== 3) return;

      const btn = document.getElementById('signup-btn');
      btn.disabled = true;
      btn.textContent = 'Signing up...';

      try {
        const blocked = await db.isBlacklisted(name);
        if (blocked) {
          NotificationSystem.show('You are not allowed to sign up.', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign Up';
          return;
        }

        const teamData = team.map(c => ({
          id: c.id,
          name: c.name,
          element: c.element,
          rarity: c.rarity,
          image: c.image
        }));

        await db.signup(currentTournament.id, name, teamData);
        NotificationSystem.show(`${name} has been registered!`, 'success');

        CharacterManager.clearTeam();
        document.getElementById('discord-input').value = '';
        signups = await db.getSignups(currentTournament.id);
        renderTournamentPage();
      } catch (e) {
        if (e.message?.includes('duplicate') || e.code === '23505') {
          NotificationSystem.show('You are already registered!', 'warning');
        } else {
          NotificationSystem.show('Error signing up. Try again.', 'error');
        }
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    }

    // --- Re-pick flow ---
    let repickTeam = [];

    function initRepickSlots() {
      const el = document.getElementById('repick-team-slots');
      if (!el) return;
      el.innerHTML = [0,1,2].map(i => {
        const c = repickTeam[i];
        return c
          ? `<div class="team-slot filled" onclick="removeRepickChar(${i})"><img src="${c.image}" alt="${c.name}" /><span class="slot-remove">×</span></div>`
          : `<div class="team-slot empty"><span>?</span></div>`;
      }).join('');
    }

    function removeRepickChar(i) {
      repickTeam.splice(i, 1);
      initRepickSlots();
      updateRepickBtn();
    }

    function updateRepickBtn() {
      const btn = document.getElementById('repick-btn');
      if (!btn) return;
      const name = document.getElementById('repick-username')?.value.trim();
      btn.disabled = !name || repickTeam.length !== 3;
    }

    function openRepickModal() {
      const modal = document.getElementById('char-modal');
      modal.classList.add('open');
      modal.dataset.mode = 'repick';
      CharacterManager.clearTeam();
      repickTeam.forEach(c => CharacterManager.toggleSelect(c));
      CharacterManager.renderFilterBar(
        document.getElementById('modal-filters'),
        document.getElementById('modal-char-grid'),
        { selectable: true, onSelect: onRepickSelect }
      );
      CharacterManager.renderTeamSlots(document.getElementById('modal-team-slots'));
      updateConfirmBtn();
    }

    function onRepickSelect(char, team) {
      CharacterManager.renderTeamSlots(document.getElementById('modal-team-slots'));
      updateConfirmBtn();
    }

    const origConfirmTeam = confirmTeam;
    confirmTeam = function() {
      const modal = document.getElementById('char-modal');
      if (modal.dataset.mode === 'repick') {
        repickTeam = CharacterManager.getTeam().map(c => ({ id: c.id, name: c.name, element: c.element, rarity: c.rarity, image: c.image }));
        modal.dataset.mode = '';
        closeCharModal();
        initRepickSlots();
        updateRepickBtn();
      } else {
        origConfirmTeam();
      }
    };

    async function submitRepick() {
      const name = document.getElementById('repick-username').value.trim();
      if (!name || repickTeam.length !== 3) return;

      const btn = document.getElementById('repick-btn');
      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const existing = signups.find(s => s.discord_username.toLowerCase() === name.toLowerCase());
        if (!existing) {
          NotificationSystem.show('Username not found. Are you signed up?', 'error');
          btn.disabled = false;
          btn.textContent = 'Update Team';
          return;
        }

        const { error } = await supabaseClient
          .from('signups')
          .update({ team: repickTeam })
          .eq('id', existing.id);

        if (error) throw error;

        NotificationSystem.show('Team updated!', 'success');
        repickTeam = [];
        document.getElementById('repick-username').value = '';
        signups = await db.getSignups(currentTournament.id);
        renderTournamentPage();
      } catch (e) {
        NotificationSystem.show('Error updating team: ' + (e.message || 'Try again'), 'error');
        btn.disabled = false;
        btn.textContent = 'Update Team';
      }
    }

    // Listen for input changes
    document.addEventListener('input', (e) => {
      if (e.target.id === 'discord-input') updateSignupBtn();
      if (e.target.id === 'repick-username') updateRepickBtn();
    });

    // Power Rankings
    let prSessionId = sessionStorage.getItem('pr_session_id');
    if (!prSessionId) {
      prSessionId = crypto.randomUUID();
      sessionStorage.setItem('pr_session_id', prSessionId);
    }
    let prCurrentRound = 1;

    async function initPowerRankings() {
      if (!currentTournament || currentTournament.status !== 'active') return;

      try {
        // Determine rounds from matches
        const { data: matches } = await supabaseClient.from('matches').select('round, winner_id').eq('tournament_id', currentTournament.id);
        if (!matches || !matches.length) {
          document.getElementById('pr-content').innerHTML = '<p class="text-muted">No matches yet.</p>';
          return;
        }

        const rounds = [...new Set(matches.map(m => m.round))].sort((a, b) => a - b);
        // Current round = max round with incomplete matches
        const roundsWithIncomplete = rounds.filter(r => matches.some(m => m.round === r && !m.winner_id));
        prCurrentRound = roundsWithIncomplete.length ? Math.min(...roundsWithIncomplete) : Math.max(...rounds);

        // Round selector
        const selector = document.getElementById('pr-round-selector');
        if (rounds.length > 1) {
          selector.innerHTML = rounds.map(r =>
            `<button class="pr-round-btn ${r === prCurrentRound ? 'active' : ''}" onclick="selectPrRound(${r})">Round ${r}</button>`
          ).join('');
        }

        await loadPrVotes();
      } catch (e) {
        console.error('Power rankings error:', e);
      }
    }

    function selectPrRound(round) {
      prCurrentRound = round;
      document.querySelectorAll('.pr-round-btn').forEach(b => b.classList.toggle('active', parseInt(b.textContent.replace('Round ', '')) === round));
      loadPrVotes();
    }

    async function loadPrVotes() {
      const content = document.getElementById('pr-content');

      try {
        const { data: votes } = await supabaseClient.from('power_rankings_votes')
          .select('*')
          .eq('tournament_id', currentTournament.id)
          .eq('round', prCurrentRound);

        const myVote = (votes || []).find(v => v.voter_session === prSessionId);

        // Tally
        const tally = {};
        (votes || []).forEach(v => {
          tally[v.voted_for] = (tally[v.voted_for] || 0) + 1;
        });

        // Get all players
        const players = signups.map(s => s.discord_username);
        const totalVotes = (votes || []).length;

        // Sort by votes desc
        players.sort((a, b) => (tally[b] || 0) - (tally[a] || 0));

        const topPlayer = players.length && totalVotes ? players[0] : null;

        content.innerHTML = `
          <div class="pr-options">
            ${players.map(p => {
              const count = tally[p] || 0;
              const pct = totalVotes ? Math.round(count / totalVotes * 100) : 0;
              const isMyVote = myVote && myVote.voted_for === p;
              return `
                <div class="pr-option ${isMyVote ? 'my-vote' : ''}" onclick="votePowerRanking('${p.replace(/'/g, "\\'")}')">
                  <div class="pr-name">${p}</div>
                  <div class="pr-bar-bg"><div class="pr-bar-fill" style="width:${pct}%"></div></div>
                  <div class="pr-pct">${pct}%</div>
                </div>`;
            }).join('')}
          </div>
          ${topPlayer && totalVotes > 0 ? `
          <div class="pr-feared">
            <div class="pr-feared__label">Most Feared Player</div>
            <div class="pr-feared__name">${topPlayer}</div>
          </div>` : ''}
        `;
      } catch (e) {
        console.error(e);
        content.innerHTML = '<p class="text-muted">Failed to load power rankings.</p>';
      }
    }

    async function votePowerRanking(username) {
      try {
        const { error } = await supabaseClient.from('power_rankings_votes').upsert({
          tournament_id: currentTournament.id,
          round: prCurrentRound,
          voter_session: prSessionId,
          voted_for: username
        }, { onConflict: 'tournament_id,round,voter_session' });

        if (error) throw error;
        NotificationSystem.show(`Voted for ${username}!`, 'success');

        // Award points for power ranking vote (once per session)
        if (!sessionStorage.getItem('pr_points_awarded')) {
          const voterName = sessionStorage.getItem('shop_username') || sessionStorage.getItem('ban_username') || sessionStorage.getItem('chat_username');
          if (voterName) {
            try {
              await db.awardPoints(voterName, 10, 'power_ranking_vote');
              const season = await getActiveSeason();
              if (season) await db.addSeasonXP(season.id, voterName, 10);
              sessionStorage.setItem('pr_points_awarded', 'true');
            } catch (ptErr) {
              console.error('Power ranking vote points error:', ptErr);
            }
          }
        }

        await loadPrVotes();
      } catch (e) {
        console.error(e);
        NotificationSystem.show('Error submitting vote.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTournament();
      setTimeout(() => {
        if (typeof AUTH !== 'undefined' && AUTH.isLoggedIn()) {
          const discordInput = document.getElementById('discord-input');
          if (discordInput && !discordInput.value) {
            discordInput.value = AUTH.getDiscordUsername() || '';
          }
        }
      }, 300);
    });

    function initCountdown(container, deadline, label) {
      if (!container || !deadline) return;

      function render() {
        const now = Date.now();
        const end = new Date(deadline).getTime();
        const diff = end - now;

        if (diff <= 0) {
          container.innerHTML = '<div class="countdown-expired">Time\'s Up!</div>';
          setTimeout(() => location.reload(), 2000);
          return;
        }

        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);

        container.innerHTML = `
          <div class="countdown-label">${label}</div>
          <div class="countdown-panel">
            <div class="countdown-unit">
              <div class="countdown-digit">${String(d).padStart(2, '0')}</div>
              <div class="countdown-suffix">Days</div>
            </div>
            <span class="countdown-separator">:</span>
            <div class="countdown-unit">
              <div class="countdown-digit">${String(h).padStart(2, '0')}</div>
              <div class="countdown-suffix">Hours</div>
            </div>
            <span class="countdown-separator">:</span>
            <div class="countdown-unit">
              <div class="countdown-digit">${String(m).padStart(2, '0')}</div>
              <div class="countdown-suffix">Mins</div>
            </div>
            <span class="countdown-separator">:</span>
            <div class="countdown-unit">
              <div class="countdown-digit">${String(s).padStart(2, '0')}</div>
              <div class="countdown-suffix">Secs</div>
            </div>
          </div>
        `;
      }

      render();
      setInterval(render, 1000);
    }
  </script>
  <script src="js/notification-inbox.js"></script>
  <script src="js/announcements.js"></script>
  <script src="js/toolbar.js"></script>
</body>
</html>
