<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History — DBL Tournaments</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    .history-header {
      text-align: center;
      padding: 40px 0 30px;
    }

    .history-title {
      font-size: clamp(24px, 4vw, 36px);
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      margin-bottom: 8px;
    }

    /* Stats summary */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 700px;
      margin: 0 auto 36px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 14px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
    }

    .stat-value {
      font-family: 'Exo 2', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--cyan);
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Tournament cards */
    .tournament-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto;
    }

    .history-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s;
      cursor: pointer;
    }

    .history-card:hover {
      border-color: rgba(0, 229, 255, 0.25);
    }

    .history-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      gap: 12px;
    }

    .history-card-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .history-card-name {
      font-family: 'Exo 2', sans-serif;
      font-weight: 800;
      font-size: 16px;
      text-transform: uppercase;
      color: var(--text);
    }

    .history-card-meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .history-card-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .history-card-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .champion-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gold-dim);
      border: 1px solid rgba(255, 215, 64, 0.25);
      border-radius: 999px;
      padding: 5px 14px 5px 10px;
    }

    .champion-tag .trophy {
      font-size: 14px;
    }

    .champion-tag .name {
      font-family: 'Exo 2', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
    }

    .expand-icon {
      color: var(--muted);
      font-size: 18px;
      transition: transform 0.2s;
    }

    .history-card.expanded .expand-icon {
      transform: rotate(180deg);
    }

    /* Expanded details */
    .history-card-details {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid var(--line);
    }

    .history-card.expanded .history-card-details {
      display: block;
    }

    .round-group {
      margin-top: 16px;
    }

    .round-label {
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--cyan);
      margin-bottom: 8px;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .match-player {
      flex: 1;
      text-align: center;
    }

    .match-player.winner {
      color: var(--gold);
      font-weight: 700;
    }

    .match-vs {
      color: var(--muted);
      font-size: 11px;
      padding: 0 10px;
    }

    .match-score {
      color: var(--muted);
      font-size: 11px;
      min-width: 50px;
      text-align: right;
    }

    .champion-team {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      justify-content: center;
    }

    .champion-team img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      border: 2px solid var(--gold);
      object-fit: cover;
    }

    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: 1fr; max-width: 280px; }
      .history-card-header { flex-direction: column; align-items: flex-start; }
      .history-card-right { align-self: flex-end; }
    }
  </style>
</head>
<body class="scanlines">
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">DBL <span>Tournaments</span></a>
      <button class="nav-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="tournament.html">Tournament</a></li>
        <li><a href="banpick.html">Ban Phase</a></li>
        <li><a href="bracket.html">Bracket</a></li>
        <li><a href="history.html" class="active">History</a></li>
      </ul>
    </div>
  </nav>

  <div class="particles-bg" id="particles"></div>

  <main class="page container page-enter">
    <div class="history-header">
      <h1 class="history-title">Tournament History</h1>
      <p class="text-muted">All past tournaments and their results</p>
    </div>

    <div class="stats-bar stagger" id="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">-</div>
        <div class="stat-label">Tournaments</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-players">-</div>
        <div class="stat-label">Unique Players</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-champion">-</div>
        <div class="stat-label">Most Wins</div>
      </div>
    </div>

    <div id="tournament-list" class="tournament-list stagger">
      <div class="loader"><div class="loader-spinner"></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/particles.js"></script>
  <script>
    initParticles(document.getElementById('particles'));

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const tournaments = await db.getCompletedTournaments();
        const listEl = document.getElementById('tournament-list');

        if (!tournaments.length) {
          listEl.innerHTML = '<div class="empty-state"><h3>No Completed Tournaments</h3><p>Check back after a tournament wraps up.</p></div>';
          return;
        }

        // Gather all signups and matches for stats
        const allSignups = [];
        const champCounts = {};
        const tournamentData = [];

        for (const t of tournaments) {
          const signups = await db.getSignups(t.id);
          const matches = await db.getMatches(t.id);
          allSignups.push(...signups);

          // Find champion: winner of the final round match
          let champion = null;
          let championSignup = null;
          if (matches.length) {
            const maxRound = Math.max(...matches.map(m => m.round));
            const finalMatch = matches.find(m => m.round === maxRound && m.winner_id);
            if (finalMatch) {
              championSignup = finalMatch.player1?.id === finalMatch.winner_id ? finalMatch.player1 : finalMatch.player2;
              if (championSignup) {
                champion = championSignup.discord_username;
                champCounts[champion] = (champCounts[champion] || 0) + 1;
              }
            }
          }

          tournamentData.push({ tournament: t, signups, matches, champion, championSignup });
        }

        // Stats
        const uniquePlayers = new Set(allSignups.map(s => s.discord_username.toLowerCase()));
        document.getElementById('stat-total').textContent = tournaments.length;
        document.getElementById('stat-players').textContent = uniquePlayers.size;

        if (Object.keys(champCounts).length) {
          const topChamp = Object.entries(champCounts).sort((a, b) => b[1] - a[1])[0];
          document.getElementById('stat-champion').textContent = topChamp[0];
          document.getElementById('stat-champion').title = `${topChamp[1]} win${topChamp[1] > 1 ? 's' : ''}`;
        } else {
          document.getElementById('stat-champion').textContent = '-';
        }

        // Render cards
        listEl.innerHTML = tournamentData.map((td, idx) => {
          const t = td.tournament;
          const date = new Date(t.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
          const playerCount = td.signups.length;

          const champHtml = td.champion
            ? `<div class="champion-tag">
                <span class="trophy">&#127942;</span>
                <a class="name" href="profile.html?player=${encodeURIComponent(td.champion)}" onclick="event.stopPropagation()">${td.champion}</a>
              </div>`
            : '';

          // Group matches by round
          const rounds = {};
          td.matches.forEach(m => {
            if (!rounds[m.round]) rounds[m.round] = [];
            rounds[m.round].push(m);
          });

          const maxRound = Math.max(...td.matches.map(m => m.round), 0);
          const roundNames = (round) => {
            if (round === maxRound) return 'Finals';
            if (round === maxRound - 1) return 'Semi-Finals';
            return `Round ${round}`;
          };

          let detailsHtml = '';
          Object.keys(rounds).sort((a, b) => a - b).forEach(round => {
            detailsHtml += `<div class="round-group">
              <div class="round-label">${roundNames(Number(round))}</div>
              ${rounds[round].map(m => {
                const p1 = m.player1?.discord_username || 'BYE';
                const p2 = m.player2?.discord_username || 'BYE';
                const p1Win = m.winner_id && m.winner_id === m.player1_id;
                const p2Win = m.winner_id && m.winner_id === m.player2_id;
                const p1Link = m.player1 ? `<a href="profile.html?player=${encodeURIComponent(p1)}" onclick="event.stopPropagation()">${p1}</a>` : p1;
                const p2Link = m.player2 ? `<a href="profile.html?player=${encodeURIComponent(p2)}" onclick="event.stopPropagation()">${p2}</a>` : p2;
                return `<div class="match-row">
                  <div class="match-player ${p1Win ? 'winner' : ''}">${p1Link}</div>
                  <div class="match-vs">VS</div>
                  <div class="match-player ${p2Win ? 'winner' : ''}">${p2Link}</div>
                </div>`;
              }).join('')}
            </div>`;
          });

          // Champion team
          if (td.championSignup?.team) {
            detailsHtml += `<div class="text-center mt-2" style="color:var(--gold);font-size:12px;font-weight:700;text-transform:uppercase;">Champion's Team</div>
              <div class="champion-team">${td.championSignup.team.map(c =>
                `<img src="${c.image}" alt="${c.name}" title="${c.name}" onerror="this.style.display='none'" />`
              ).join('')}</div>`;
          }

          return `<div class="history-card" onclick="this.classList.toggle('expanded')">
            <div class="history-card-header">
              <div class="history-card-left">
                <div class="history-card-name">${t.name}</div>
                <div class="history-card-meta">
                  <span>${date}</span>
                  <span>${playerCount} players</span>
                </div>
              </div>
              <div class="history-card-right">
                ${champHtml}
                <span class="expand-icon">&#9660;</span>
              </div>
            </div>
            <div class="history-card-details">${detailsHtml}</div>
          </div>`;
        }).join('');

      } catch (e) {
        console.error('History load error:', e);
        document.getElementById('tournament-list').innerHTML =
          '<div class="empty-state"><p>Error loading tournament history.</p></div>';
      }
    });
  </script>
</body>
</html>
