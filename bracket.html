<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bracket — DBL Tournaments</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/bracket.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes.css" />
</head>
<body class="scanlines">
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">DBL <span>Tournaments</span></a>
      <button class="nav-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">☰</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="tournament.html">Tournament</a></li>
        <li><a href="banpick.html">Ban Phase</a></li>
        <li><a href="rankings.html">Rankings</a></li>
        <li><a href="bracket.html" class="active">Bracket</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </div>
  </nav>

  <div class="particles-bg" id="particles"></div>

  <main class="page page-enter">
    <div class="container">
      <div style="text-align:center;padding:20px 0;">
        <h1 style="color:var(--cyan);text-shadow:0 0 20px rgba(0,229,255,0.3);" id="bracket-title">Tournament Bracket</h1>
        <p class="text-muted mt-1" id="bracket-sub"></p>
      </div>
    </div>
    <div class="bracket-container" id="bracket-container">
      <div class="loader"><div class="loader-spinner"></div></div>
    </div>

    <!-- Match Chat -->
    <div class="container mt-4" id="chat-section" style="display:none;">
      <div class="card chat-panel" style="max-width:600px;margin:0 auto;">
        <div class="chat-header" onclick="toggleChat()">
          <h3 style="margin:0;font-family:'Exo 2',sans-serif;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;">
            <span>Match Chat</span>
            <span id="chat-toggle-icon" style="font-size:0.8rem;color:var(--muted);">▼</span>
          </h3>
        </div>
        <div id="chat-body" style="display:none;">
          <div style="margin-bottom:12px;">
            <label style="font-weight:600;font-size:0.85rem;color:var(--muted);">Match</label>
            <select id="chat-match-select" onchange="switchChatMatch()" style="width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:var(--radius-sm);font-family:'Chakra Petch',sans-serif;margin-top:4px;">
              <option value="">Select a match...</option>
            </select>
          </div>
          <div id="chat-username-prompt" style="margin-bottom:12px;">
            <label style="font-weight:600;font-size:0.85rem;color:var(--muted);">Your Discord Username</label>
            <div style="display:flex;gap:8px;margin-top:4px;">
              <input type="text" id="chat-username-input" placeholder="e.g. Player#1234" style="flex:1;" />
              <button class="btn btn-primary" onclick="setChatUsername()" style="padding:8px 16px;font-size:0.85rem;">Join</button>
            </div>
          </div>
          <div id="chat-messages" style="display:none;height:250px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;margin-bottom:12px;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--cyan) var(--bg-2);">
            <div id="chat-messages-list"></div>
          </div>
          <div id="chat-input-area" style="display:none;">
            <div style="display:flex;gap:8px;">
              <input type="text" id="chat-input" placeholder="Type a message..." style="flex:1;" onkeydown="if(event.key==='Enter')sendChat()" />
              <button class="btn btn-primary" onclick="sendChat()" style="padding:8px 16px;font-size:0.85rem;">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Match Report Form -->
    <div class="container mt-4" id="report-section" style="display:none;">
      <div class="card" style="max-width:500px;margin:0 auto;">
        <h3 class="mb-2">Report Match Result</h3>
        <p class="text-muted mb-2" style="font-size:13px;">Played your match? Report the result and your admin will verify it.</p>
        <div class="flex flex-col gap-2">
          <label style="font-weight:600;font-size:0.9rem;">Your Discord Username</label>
          <input type="text" id="report-username" placeholder="e.g. Player#1234" />
          <label style="font-weight:600;font-size:0.9rem;">Who Won?</label>
          <input type="text" id="report-winner" placeholder="Winner's Discord Username" />
          <label style="font-weight:600;font-size:0.9rem;">Screenshot URL (optional)</label>
          <input type="text" id="report-screenshot" placeholder="Link to screenshot proof" />
          <label style="font-weight:600;font-size:0.9rem;">Notes (optional)</label>
          <input type="text" id="report-notes" placeholder="e.g. 2-1, close match" />
          <button class="btn btn-primary mt-2" onclick="submitReport()">Submit Report</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/bracket.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/particles.js"></script>
  <script>
    initParticles(document.getElementById('particles'));

    async function loadBracket() {
      const container = document.getElementById('bracket-container');

      try {
        const tournament = await db.getActiveTournament();
        if (!tournament) {
          // Try most recent completed
          const all = await db.getAllTournaments();
          const latest = all.find(t => t.status === 'completed') || all[0];
          if (!latest) {
            container.innerHTML = '<div class="empty-state"><h3>No Tournament</h3><p>No bracket data available yet.</p></div>';
            return;
          }
          await renderBracketFor(latest, container);
          return;
        }

        if (tournament.theme) ThemeManager.apply(tournament.theme);
        document.getElementById('bracket-title').textContent = tournament.name;
        document.getElementById('bracket-sub').textContent =
          tournament.status === 'signup' ? 'Bracket will be generated when signups close' : 'Live bracket';

        if (tournament.status === 'signup') {
          container.innerHTML = '<div class="empty-state"><h3>Signups Still Open</h3><p>The bracket will appear once the tournament begins.</p></div>';
          return;
        }

        await renderBracketFor(tournament, container);

        // Show match report form and chat if tournament is active
        activeTournament = tournament;
        if (tournament.status === 'active') {
          document.getElementById('report-section').style.display = 'block';
          const matches = await db.getMatches(tournament.id);
          await initChat(tournament, matches);
        }

        // Track spectators
        try {
          await db.trackSpectator(tournament.id, 'bracket');
          setInterval(() => db.trackSpectator(tournament.id, 'bracket').catch(() => {}), 60000);
          const count = await db.getSpectatorCount(tournament.id);
          if (count > 0) {
            document.getElementById('bracket-sub').textContent += ` — ${count} watching live`;
          }
        } catch (e) {}

        subscribeToChanges(tournament.id, {
          onMatch: async () => {
            await renderBracketFor(tournament, container);
            NotificationSystem.show('A match result has been updated!', 'ko');
          }
        });
      } catch (e) {
        container.innerHTML = '<div class="empty-state"><h3>Not Connected</h3><p>Connect to Supabase to view the bracket.</p></div>';
      }
    }

    async function renderBracketFor(tournament, container) {
      const signups = await db.getSignups(tournament.id);
      const matches = await db.getMatches(tournament.id);

      // Compute global ban list from votes
      const bannedCharIds = new Set();
      const votes = {};
      signups.forEach(s => {
        if (s.bans && s.bans.length > 0) {
          s.bans.forEach(id => { votes[id] = (votes[id] || 0) + 1; });
        }
      });
      const banCount = tournament.ban_count || 1;
      const sorted = Object.entries(votes).sort((a, b) => b[1] - a[1]);
      sorted.slice(0, banCount).forEach(([id]) => bannedCharIds.add(id));

      BracketManager.renderBracket(container, matches, signups, {
        teamsVisible: tournament.teams_visible,
        bannedCharIds
      });
    }

    let activeTournament = null;

    async function submitReport() {
      const username = document.getElementById('report-username').value.trim();
      const winner = document.getElementById('report-winner').value.trim();
      const screenshot = document.getElementById('report-screenshot').value.trim();
      const notes = document.getElementById('report-notes').value.trim();

      if (!username || !winner) {
        NotificationSystem.show('Username and winner are required', 'error');
        return;
      }

      if (!activeTournament) return;

      try {
        const signups = await db.getSignups(activeTournament.id);
        const matches = await db.getMatches(activeTournament.id);

        const playerSignup = signups.find(s => s.discord_username.toLowerCase() === username.toLowerCase());
        if (!playerSignup) {
          NotificationSystem.show('You are not in this tournament', 'error');
          return;
        }

        const myMatch = matches.find(m =>
          !m.winner_id &&
          (m.player1_id === playerSignup.id || m.player2_id === playerSignup.id)
        );

        if (!myMatch) {
          NotificationSystem.show('No pending match found for you', 'error');
          return;
        }

        await db.submitMatchReport({
          match_id: myMatch.id,
          reported_by: username,
          claimed_winner: winner,
          screenshot_url: screenshot || null,
          notes: notes || null
        });

        NotificationSystem.show('Report submitted! Waiting for admin approval.', 'success');
        document.getElementById('report-username').value = '';
        document.getElementById('report-winner').value = '';
        document.getElementById('report-screenshot').value = '';
        document.getElementById('report-notes').value = '';
      } catch (e) {
        NotificationSystem.show('Error: ' + e.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadBracket);

    // --- Chat ---
    let chatChannel = null;
    let currentChatMatchId = null;
    let chatMatches = [];

    function toggleChat() {
      const body = document.getElementById('chat-body');
      const icon = document.getElementById('chat-toggle-icon');
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
      icon.textContent = open ? '▲' : '▼';
      if (open) playSound?.('click');
    }

    function setChatUsername() {
      const input = document.getElementById('chat-username-input').value.trim();
      if (!input) { NotificationSystem.show('Enter a username', 'warning'); return; }
      sessionStorage.setItem('chat_username', input);
      document.getElementById('chat-username-prompt').style.display = 'none';
      document.getElementById('chat-messages').style.display = 'block';
      document.getElementById('chat-input-area').style.display = 'block';
      playSound?.('click');
      if (currentChatMatchId) loadChatMessages(currentChatMatchId);
    }

    function getChatUsername() {
      return sessionStorage.getItem('chat_username');
    }

    async function initChat(tournament, matches) {
      const active = matches.filter(m => !m.winner_id && m.player1_id && m.player2_id);
      if (!active.length && !matches.length) return;
      chatMatches = active.length ? active : matches.slice(-4);

      const select = document.getElementById('chat-match-select');
      select.innerHTML = '<option value="">Select a match...</option>';
      const signups = await db.getSignups(tournament.id);
      const nameMap = {};
      signups.forEach(s => { nameMap[s.id] = s.discord_username; });

      chatMatches.forEach(m => {
        const p1 = nameMap[m.player1_id] || 'TBD';
        const p2 = nameMap[m.player2_id] || 'TBD';
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = `R${m.round} M${m.match_number}: ${p1} vs ${p2}`;
        select.appendChild(opt);
      });

      document.getElementById('chat-section').style.display = 'block';

      // Restore saved username
      const saved = getChatUsername();
      if (saved) {
        document.getElementById('chat-username-input').value = saved;
        setChatUsername();
      }
    }

    async function switchChatMatch() {
      const matchId = document.getElementById('chat-match-select').value;
      if (!matchId) return;
      currentChatMatchId = matchId;
      if (chatChannel) { supabaseClient.removeChannel(chatChannel); chatChannel = null; }
      if (getChatUsername()) await loadChatMessages(matchId);

      // Subscribe to realtime
      chatChannel = supabaseClient.channel(`chat-${matchId}`)
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'match_chat', filter: `match_id=eq.${matchId}` },
          (payload) => appendChatMessage(payload.new)
        ).subscribe();
    }

    async function loadChatMessages(matchId) {
      const list = document.getElementById('chat-messages-list');
      list.innerHTML = '';
      try {
        const messages = await db.getMatchChat(matchId);
        messages.forEach(m => appendChatMessage(m));
      } catch (e) {
        list.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;">Could not load messages.</p>';
      }
    }

    function appendChatMessage(msg) {
      const list = document.getElementById('chat-messages-list');
      const container = document.getElementById('chat-messages');
      // Deduplicate
      if (list.querySelector(`[data-msg-id="${msg.id}"]`)) return;

      const isMe = msg.username === getChatUsername();
      const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.setAttribute('data-msg-id', msg.id);
      div.style.cssText = `margin-bottom:8px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--panel);border-left:3px solid ${isMe ? 'var(--cyan)' : 'var(--pink)'};`;
      div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
        <span style="font-weight:700;font-size:0.8rem;color:${isMe ? 'var(--cyan)' : 'var(--pink)'};">${escapeHtml(msg.username)}</span>
        <span style="font-size:0.7rem;color:var(--muted);">${time}</span>
      </div>
      <div style="font-size:0.85rem;color:var(--text);word-break:break-word;">${escapeHtml(msg.message)}</div>`;
      list.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    async function sendChat() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      const username = getChatUsername();
      if (!message || !username || !currentChatMatchId) return;
      input.value = '';
      try {
        await db.sendChatMessage(currentChatMatchId, username, message);
        playSound?.('click');
      } catch (e) {
        NotificationSystem.show('Failed to send message', 'error');
        input.value = message;
      }
    }
  </script>
</body>
</html>
