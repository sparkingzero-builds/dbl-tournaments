<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rankings — DBL Tournaments</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <style>
    .rankings-header {
      text-align: center;
      padding: 40px 0 30px;
    }

    .rankings-title {
      font-size: clamp(24px, 4vw, 36px);
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      margin-bottom: 8px;
    }

    .rankings-subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .view-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .view-tab {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 20px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
      transition: all 0.15s;
    }
    .view-tab:hover { color: var(--text); border-color: var(--muted); }
    .view-tab.active { background: var(--cyan); border-color: var(--cyan); color: #000; }

    .season-select-row {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .season-select-row select {
      min-width: 200px;
    }

    .hall-of-fame {
      max-width: 800px;
      margin: 0 auto 32px;
    }
    .hof-title {
      font-size: 18px;
      color: var(--gold);
      text-align: center;
      margin-bottom: 16px;
    }
    .hof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .hof-card {
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      padding: 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hof-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), #ff6b00);
    }
    .hof-season {
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .hof-player {
      font-family: 'Exo 2', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--gold);
    }
    .hof-player a { color: var(--gold); }
    .hof-player a:hover { color: #fff; }
    .hof-xp {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .search-bar {
      max-width: 400px;
      margin: 0 auto 24px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding-left: 36px;
    }

    .search-bar .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .leaderboard {
      max-width: 800px;
      margin: 0 auto;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 50px 1fr 100px 100px 80px;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 6px;
      transition: all 0.15s;
    }

    .lb-row:hover {
      border-color: var(--cyan);
      background: var(--panel-2);
    }

    .lb-row.top-1 {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.15);
    }

    .lb-row.top-2 {
      border-color: #c0c0c0;
      box-shadow: 0 0 12px rgba(192, 192, 192, 0.1);
    }

    .lb-row.top-3 {
      border-color: #cd7f32;
      box-shadow: 0 0 12px rgba(205, 127, 50, 0.1);
    }

    .lb-header {
      display: grid;
      grid-template-columns: 50px 1fr 100px 100px 80px;
      padding: 8px 16px;
      margin-bottom: 8px;
    }

    .lb-header span {
      font-family: 'Exo 2', sans-serif;
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .lb-rank {
      font-family: 'Exo 2', sans-serif;
      font-weight: 900;
      font-size: 16px;
      color: var(--muted);
    }

    .top-1 .lb-rank { color: var(--gold); font-size: 20px; }
    .top-2 .lb-rank { color: #c0c0c0; font-size: 18px; }
    .top-3 .lb-rank { color: #cd7f32; font-size: 18px; }

    .lb-player {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lb-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      transition: color 0.15s;
    }

    .lb-name:hover {
      color: var(--cyan);
    }

    .lb-tier {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      line-height: 1;
    }

    .tier-diamond { background: rgba(185, 242, 255, 0.15); color: #b9f2ff; }
    .tier-platinum { background: rgba(229, 228, 226, 0.15); color: #e5e4e2; }
    .tier-gold { background: rgba(255, 215, 0, 0.15); color: var(--gold); }
    .tier-silver { background: rgba(192, 192, 192, 0.15); color: #c0c0c0; }
    .tier-bronze { background: rgba(205, 127, 50, 0.15); color: #cd7f32; }

    .lb-elo {
      font-family: 'Exo 2', sans-serif;
      font-weight: 900;
      font-size: 16px;
      color: var(--cyan);
    }

    .lb-record {
      font-size: 13px;
      color: var(--muted);
    }

    .lb-record .w { color: var(--green, #4caf50); font-weight: 700; }
    .lb-record .l { color: var(--red, #f44336); font-weight: 700; }

    .lb-tourneys {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .accolades-section {
      margin-bottom: 30px;
    }
    .accolades-section h2 {
      font-family: 'Exo 2', sans-serif;
      font-size: 18px;
      color: var(--cyan);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .accolades-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .accolade-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .accolade-card:hover {
      border-color: var(--gold);
    }
    .accolade-icon {
      font-size: 32px;
      margin-bottom: 6px;
    }
    .accolade-title {
      font-family: 'Exo 2', sans-serif;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .accolade-player {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
    }
    .accolade-player a {
      color: var(--text);
      text-decoration: none;
    }
    .accolade-player a:hover {
      color: var(--cyan);
    }

    @media (max-width: 600px) {
      .lb-row, .lb-header {
        grid-template-columns: 36px 1fr 70px 70px;
      }
      .lb-tourneys, .lb-header span:last-child {
        display: none;
      }
      .lb-row {
        padding: 10px 12px;
      }
      .lb-elo {
        font-size: 14px;
      }
    }
  </style>
</head>
<body class="scanlines">
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">DBL <span>Tournaments</span></a>
      <button class="nav-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="tournament.html">Tournament</a></li>
        <li><a href="banpick.html">Ban Phase</a></li>
        <li><a href="rankings.html" class="active">Rankings</a></li>
        <li><a href="bracket.html">Bracket</a></li>
        <li><a href="history.html">History</a></li>
        <li class="nav-dropdown">
          <a href="#">More ▾</a>
          <div class="nav-dropdown-menu">
            <a href="compare.html">Compare</a>
            <a href="shop.html">Shop</a>
            <a href="tierlist.html">Tier List</a>
            <a href="characters.html">Characters</a>
            <a href="season.html">Season</a>
            <a href="feed.html">Live Feed</a>
            <a href="analytics.html">Ban Analytics</a>
          </div>
        </li>
      </ul>
    </div>

  <div class="particles-bg" id="particles"></div>

  <main class="page container page-enter">
    <div class="rankings-header">
      <h1 class="rankings-title">ELO Rankings</h1>
      <p class="rankings-subtitle">Competitive leaderboard based on match performance</p>
    </div>

    <div class="view-tabs">
      <button class="view-tab active" onclick="switchView('elo')">ELO Rankings</button>
      <button class="view-tab" onclick="switchView('season')">Season Leaderboard</button>
      <button class="view-tab" onclick="switchView('hof')">Hall of Fame</button>
    </div>

    <div id="elo-view">
      <div id="accolades-container"></div>

      <div class="search-bar">
      <span class="search-icon">&#128269;</span>
      <input type="search" id="player-search" placeholder="Search player..." />
    </div>

    <div class="leaderboard" id="leaderboard">
      <div class="loader"><div class="loader-spinner"></div></div>
    </div>
    </div>

    <div id="season-view" style="display:none;">
      <div class="season-select-row">
        <select id="season-select" class="input" onchange="loadSeasonLeaderboard()">
          <option value="">Loading seasons...</option>
        </select>
      </div>
      <div class="leaderboard" id="season-leaderboard">
        <div class="empty-state"><p>Select a season to view its leaderboard.</p></div>
      </div>
    </div>

    <div id="hof-view" style="display:none;">
      <div class="hall-of-fame">
        <h2 class="hof-title">Hall of Fame</h2>
        <div id="hof-grid" class="hof-grid">
          <div class="loader"><div class="loader-spinner"></div></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/particles.js"></script>
  <script>
    initParticles(document.getElementById('particles'));

    let allPlayers = [];

    function getTier(elo) {
      if (elo >= 1400) return { name: 'Diamond', cls: 'tier-diamond' };
      if (elo >= 1200) return { name: 'Platinum', cls: 'tier-platinum' };
      if (elo >= 1100) return { name: 'Gold', cls: 'tier-gold' };
      if (elo >= 1000) return { name: 'Silver', cls: 'tier-silver' };
      return { name: 'Bronze', cls: 'tier-bronze' };
    }

    function renderLeaderboard(players) {
      const container = document.getElementById('leaderboard');

      if (!players.length) {
        container.innerHTML = '<div class="empty-state"><h3>No Rankings Yet</h3><p>Rankings will appear after tournament matches are processed.</p></div>';
        return;
      }

      let html = `
        <div class="lb-header">
          <span>#</span>
          <span>Player</span>
          <span>ELO</span>
          <span>Record</span>
          <span>Tourneys</span>
        </div>
      `;

      players.forEach((p, i) => {
        const rank = i + 1;
        const tier = getTier(p.elo);
        const topClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';

        html += `
          <div class="lb-row ${topClass} stagger">
            <div class="lb-rank">${rank}</div>
            <div class="lb-player">
              <a class="lb-name" href="profile.html?player=${encodeURIComponent(p.discord_username)}">${p.discord_username}</a>
              <span class="lb-tier ${tier.cls}">${tier.name}</span>
            </div>
            <div class="lb-elo">${p.elo}</div>
            <div class="lb-record"><span class="w">${p.wins}</span>W / <span class="l">${p.losses}</span>L</div>
            <div class="lb-tourneys">${p.tournaments_played || 0}</div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    document.getElementById('player-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderLeaderboard(allPlayers);
        return;
      }
      const filtered = allPlayers.filter(p => p.discord_username.toLowerCase().includes(q));
      renderLeaderboard(filtered);
    });

    async function loadAccolades() {
      try {
        let champion = null, mostFeared = null, fanFavorite = null, veteran = null;

        // Current Champion
        const { data: completedTourneys } = await supabaseClient
          .from('tournaments')
          .select('id, name')
          .eq('status', 'completed')
          .order('created_at', { ascending: false })
          .limit(1);
        if (completedTourneys?.length) {
          const { data: finalMatch } = await supabaseClient
            .from('matches')
            .select('winner_id, player1:tournament_signups!matches_player1_id_fkey(discord_username), player2:tournament_signups!matches_player2_id_fkey(discord_username)')
            .eq('tournament_id', completedTourneys[0].id)
            .not('winner_id', 'is', null)
            .order('round', { ascending: false })
            .limit(1);
          if (finalMatch?.length) {
            champion = finalMatch[0].winner_id === finalMatch[0].player1?.id
              ? finalMatch[0].player1?.discord_username
              : finalMatch[0].player2?.discord_username;
          }
        }

        // Most Feared
        const { data: fearData } = await supabaseClient
          .from('power_rankings_votes')
          .select('voted_for');
        const fearCounts = {};
        (fearData || []).forEach(v => { fearCounts[v.voted_for] = (fearCounts[v.voted_for] || 0) + 1; });
        mostFeared = Object.entries(fearCounts).sort((a,b) => b[1] - a[1])[0]?.[0] || null;

        // Fan Favorite
        const { data: hypeData } = await supabaseClient
          .from('match_hype')
          .select('match_id, hype_count');
        const { data: allMatches } = await supabaseClient
          .from('matches')
          .select('id, player1:tournament_signups!matches_player1_id_fkey(discord_username), player2:tournament_signups!matches_player2_id_fkey(discord_username)');
        const playerHype = {};
        (hypeData || []).forEach(h => {
          const m = (allMatches || []).find(mm => mm.id === h.match_id);
          if (m) {
            const p1 = m.player1?.discord_username;
            const p2 = m.player2?.discord_username;
            if (p1) playerHype[p1] = (playerHype[p1] || 0) + h.hype_count;
            if (p2) playerHype[p2] = (playerHype[p2] || 0) + h.hype_count;
          }
        });
        fanFavorite = Object.entries(playerHype).sort((a,b) => b[1] - a[1])[0]?.[0] || null;

        // Veteran
        const { data: allSignups } = await supabaseClient
          .from('tournament_signups')
          .select('discord_username');
        const signupCounts = {};
        (allSignups || []).forEach(s => { signupCounts[s.discord_username] = (signupCounts[s.discord_username] || 0) + 1; });
        veteran = Object.entries(signupCounts).sort((a,b) => b[1] - a[1])[0]?.[0] || null;

        // Render
        const accoladesList = [
          { icon: '🏆', title: 'Current Champion', player: champion },
          { icon: '😱', title: 'Most Feared', player: mostFeared },
          { icon: '🔥', title: 'Fan Favorite', player: fanFavorite },
          { icon: '🎖️', title: 'Veteran', player: veteran },
        ].filter(a => a.player);

        if (accoladesList.length === 0) return;

        const container = document.getElementById('accolades-container');
        container.innerHTML = `
          <div class="accolades-section">
            <h2>Accolades</h2>
            <div class="accolades-grid">
              ${accoladesList.map(a => `
                <div class="accolade-card">
                  <div class="accolade-icon">${a.icon}</div>
                  <div class="accolade-title">${a.title}</div>
                  <div class="accolade-player"><a href="profile.html?player=${encodeURIComponent(a.player)}">${a.player}</a></div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } catch (e) {
        console.warn('Accolades load error:', e);
      }
    }

    function switchView(view) {
      document.querySelectorAll('.view-tab').forEach((t, i) => {
        t.classList.toggle('active', ['elo', 'season', 'hof'][i] === view);
      });
      document.getElementById('elo-view').style.display = view === 'elo' ? '' : 'none';
      document.getElementById('season-view').style.display = view === 'season' ? '' : 'none';
      document.getElementById('hof-view').style.display = view === 'hof' ? '' : 'none';
      if (view === 'season' && !seasonsLoaded) loadSeasons();
      if (view === 'hof' && !hofLoaded) loadHallOfFame();
    }

    let seasonsLoaded = false;
    let hofLoaded = false;

    async function loadSeasons() {
      try {
        const seasons = await db.getAllSeasons();
        const select = document.getElementById('season-select');
        if (!seasons.length) {
          select.innerHTML = '<option value="">No seasons yet</option>';
          seasonsLoaded = true;
          return;
        }
        select.innerHTML = seasons.map(s =>
          `<option value="${s.id}">${s.name} ${s.status === 'active' ? '(Active)' : ''}</option>`
        ).join('');
        seasonsLoaded = true;
        loadSeasonLeaderboard();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadSeasonLeaderboard() {
      const seasonId = document.getElementById('season-select').value;
      const container = document.getElementById('season-leaderboard');
      if (!seasonId) { container.innerHTML = '<div class="empty-state"><p>Select a season.</p></div>'; return; }

      container.innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
      try {
        const lb = await db.getSeasonLeaderboard(seasonId);
        if (!lb.length) {
          container.innerHTML = '<div class="empty-state"><p>No players in this season yet.</p></div>';
          return;
        }
        let html = `<div class="lb-header"><span>#</span><span>Player</span><span>XP</span><span>Tier</span><span></span></div>`;
        lb.forEach((p, i) => {
          const rank = i + 1;
          const topClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
          const tier = Math.floor(p.xp / 100);
          html += `<div class="lb-row ${topClass}">
            <div class="lb-rank">${rank}</div>
            <div class="lb-player"><a class="lb-name" href="profile.html?player=${encodeURIComponent(p.discord_username)}">${p.discord_username}</a></div>
            <div class="lb-elo">${p.xp}</div>
            <div class="lb-record">Tier ${tier}</div>
            <div class="lb-tourneys">${(p.claimed_tiers || []).length} claimed</div>
          </div>`;
        });
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = '<div class="empty-state"><p>Error loading season data.</p></div>';
      }
    }

    async function loadHallOfFame() {
      try {
        const seasons = await db.getAllSeasons();
        const completed = seasons.filter(s => s.status === 'completed');
        const grid = document.getElementById('hof-grid');

        if (!completed.length) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>No Completed Seasons</h3><p>Season champions will be immortalized here.</p></div>';
          hofLoaded = true;
          return;
        }

        const cards = [];
        for (const s of completed) {
          const lb = await db.getSeasonLeaderboard(s.id);
          if (lb.length > 0) {
            cards.push({ season: s, champion: lb[0] });
          }
        }

        grid.innerHTML = cards.length === 0
          ? '<div class="empty-state" style="grid-column:1/-1;"><p>No season data yet.</p></div>'
          : cards.map(c => `
            <div class="hof-card">
              <div class="hof-season">${c.season.name}</div>
              <div class="hof-player"><a href="profile.html?player=${encodeURIComponent(c.champion.discord_username)}">${c.champion.discord_username}</a></div>
              <div class="hof-xp">${c.champion.xp} XP</div>
            </div>
          `).join('');

        hofLoaded = true;
      } catch (e) {
        document.getElementById('hof-grid').innerHTML = '<div class="empty-state"><p>Error loading hall of fame.</p></div>';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        allPlayers = await db.getLeaderboard();
        renderLeaderboard(allPlayers);
        await loadAccolades();
      } catch (e) {
        console.error('Rankings load error:', e);
        document.getElementById('leaderboard').innerHTML = '<div class="empty-state"><p>Error loading rankings.</p></div>';
      }
    });
  </script>
  <script src="js/toolbar.js"></script>
</body>
</html>
