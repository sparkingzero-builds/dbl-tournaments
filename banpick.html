<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ban Phase — DBL Tournaments</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/roster.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <style>
    .ban-header {
      text-align: center;
      padding: 40px 0 20px;
    }

    .ban-title {
      font-size: clamp(24px, 4vw, 36px);
      color: var(--pink);
      text-shadow: 0 0 20px rgba(255, 45, 120, 0.4);
    }

    .ban-subtitle {
      color: var(--muted);
      font-size: 14px;
      max-width: 500px;
      margin: 8px auto 0;
    }

    .ban-login {
      max-width: 400px;
      margin: 40px auto;
    }

    .ban-phase-content {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      margin-top: 24px;
    }

    .ban-sidebar {
      position: sticky;
      top: 80px;
      align-self: start;
    }

    .ban-slot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      transition: all 0.15s;
    }

    .ban-slot.filled {
      border-color: var(--pink);
      background: rgba(255, 45, 120, 0.06);
    }

    .ban-slot__img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .ban-slot__name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .ban-slot__empty {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    .ban-slot__remove {
      background: none;
      border: none;
      color: var(--pink);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .ban-slot__remove:hover {
      color: #fff;
    }

    .ban-counter {
      font-family: 'Exo 2', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--pink);
      text-align: center;
      margin-bottom: 12px;
    }

    .ban-counter span {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .banned-overlay {
      position: relative;
    }

    .banned-overlay::after {
      content: '🚫';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      opacity: 0.8;
      pointer-events: none;
    }

    .char-card.banned {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(1);
    }

    .char-card.ban-selected {
      border-color: var(--pink) !important;
      box-shadow: 0 0 12px rgba(255, 45, 120, 0.3) !important;
    }

    .ban-status-list {
      margin-top: 24px;
    }

    .ban-player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }

    .ban-player-row .player-name {
      font-weight: 700;
    }

    .ban-done {
      color: var(--green);
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .ban-pending {
      color: var(--muted);
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .ban-success {
      text-align: center;
      padding: 60px 20px;
    }

    .ban-success h2 {
      color: var(--pink);
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .ban-phase-content {
        grid-template-columns: 1fr;
      }

      .ban-sidebar {
        position: static;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .ban-sidebar .ban-counter {
        grid-column: 1 / -1;
      }

      .ban-sidebar .btn {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body class="scanlines">
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">DBL <span>Tournaments</span></a>
      <button class="nav-toggle" onclick="document.querySelector('.navbar-links').classList.toggle('open')">☰</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="tournament.html">Tournament</a></li>
        <li><a href="banpick.html" class="active">Ban Phase</a></li>
        <li><a href="bracket.html">Bracket</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </div>
  </nav>

  <div class="particles-bg" id="particles"></div>

  <main class="page container page-enter">
    <div id="ban-content">
      <div class="loader"><div class="loader-spinner"></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/particles.js"></script>
  <script>
    initParticles(document.getElementById('particles'));

    let tournament = null;
    let signups = [];
    let mySignup = null;
    let bannedChars = [];
    let banCount = 3;
    let allChars = [];

    async function init() {
      const content = document.getElementById('ban-content');

      try {
        tournament = await db.getActiveTournament();
        if (!tournament) {
          const all = await db.getAllTournaments();
          tournament = all.find(t => t.status === 'banning') || null;
        }
      } catch (e) {
        tournament = null;
      }

      if (!tournament || tournament.status !== 'banning') {
        content.innerHTML = `
          <div class="ban-header">
            <h1 class="ban-title">Ban Phase</h1>
            <p class="ban-subtitle">No tournament is currently in the ban phase.</p>
          </div>
          <div style="text-align:center;padding:40px;">
            <a href="tournament.html" class="btn btn-secondary">Back to Tournament</a>
          </div>`;
        return;
      }

      if (tournament.theme) ThemeManager.apply(tournament.theme);
      banCount = tournament.ban_count || 3;

      try {
        signups = await db.getSignups(tournament.id);
      } catch (e) {
        signups = [];
      }

      await CharacterManager.load();
      allChars = CharacterManager.getAll();

      showLoginOrBanPhase();
    }

    function showLoginOrBanPhase() {
      const content = document.getElementById('ban-content');
      const saved = sessionStorage.getItem('ban_username');

      if (saved) {
        mySignup = signups.find(s => s.discord_username.toLowerCase() === saved.toLowerCase());
        if (mySignup) {
          if (mySignup.bans && mySignup.bans.length >= banCount) {
            showAlreadyBanned();
            return;
          }
          bannedChars = mySignup.bans || [];
          showBanPhase();
          return;
        }
      }

      content.innerHTML = `
        <div class="ban-header">
          <h1 class="ban-title">⚔ Ban Phase</h1>
          <p class="ban-subtitle">${tournament.name} — Each player bans ${banCount} character${banCount !== 1 ? 's' : ''} that opponents cannot use against them.</p>
        </div>
        <div class="ban-login">
          <div class="card card-glow">
            <h3 class="mb-2">Enter Your Username</h3>
            <p class="text-muted mb-2" style="font-size:13px;">Enter the Discord username you signed up with.</p>
            <input type="text" id="ban-username" placeholder="e.g. Player#1234" />
            <button class="btn btn-primary btn-lg mt-2" onclick="loginForBan()" style="width:100%;">Enter Ban Phase</button>
          </div>
          <div class="ban-status-list mt-3">
            <h4 class="mb-1 text-muted">Ban Status</h4>
            ${signups.map(s => `
              <div class="ban-player-row">
                <span class="player-name">${s.discord_username}</span>
                ${s.bans && s.bans.length >= banCount
                  ? '<span class="ban-done">✓ Done</span>'
                  : '<span class="ban-pending">Pending</span>'}
              </div>
            `).join('')}
          </div>
        </div>`;

      document.getElementById('ban-username')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') loginForBan();
      });
    }

    function loginForBan() {
      const input = document.getElementById('ban-username');
      const username = input.value.trim();
      if (!username) {
        NotificationSystem.show('Enter your username', 'error');
        return;
      }

      mySignup = signups.find(s => s.discord_username.toLowerCase() === username.toLowerCase());
      if (!mySignup) {
        NotificationSystem.show('Username not found in this tournament', 'error');
        return;
      }

      sessionStorage.setItem('ban_username', mySignup.discord_username);

      if (mySignup.bans && mySignup.bans.length >= banCount) {
        showAlreadyBanned();
        return;
      }

      bannedChars = mySignup.bans || [];
      showBanPhase();
    }

    function showAlreadyBanned() {
      const content = document.getElementById('ban-content');
      const bannedNames = (mySignup.bans || []).map(id => {
        const c = allChars.find(ch => ch.id === id);
        return c ? c.name : id;
      });

      content.innerHTML = `
        <div class="ban-success">
          <h2>Bans Submitted!</h2>
          <p class="text-muted mb-3">You've already submitted your ${banCount} ban${banCount !== 1 ? 's' : ''} for this tournament.</p>
          <div class="card" style="max-width:400px;margin:0 auto;">
            <h4 class="mb-2 text-pink">Your Bans</h4>
            ${(mySignup.bans || []).map(id => {
              const c = allChars.find(ch => ch.id === id);
              return c ? `
                <div class="ban-slot filled">
                  <img class="ban-slot__img" src="${c.image}" alt="${c.name}" onerror="this.style.display='none'" />
                  <span class="ban-slot__name">${c.name}</span>
                </div>` : '';
            }).join('')}
          </div>
          <a href="tournament.html" class="btn btn-secondary mt-3">Back to Tournament</a>
        </div>`;
    }

    function showBanPhase() {
      const content = document.getElementById('ban-content');

      content.innerHTML = `
        <div class="ban-header">
          <h1 class="ban-title">⚔ Ban Phase</h1>
          <p class="ban-subtitle">Select ${banCount} character${banCount !== 1 ? 's' : ''} to ban. Your opponents will not be able to use these characters against you.</p>
        </div>
        <div class="ban-phase-content">
          <div class="ban-sidebar">
            <div class="ban-counter"><span id="ban-count-display">${bannedChars.length}</span> / ${banCount} <span>Bans</span></div>
            <div id="ban-slots"></div>
            <button class="btn btn-primary btn-lg mt-2" id="submit-bans-btn" onclick="submitBans()" disabled style="width:100%;">
              Confirm Bans
            </button>
          </div>
          <div>
            <div class="filter-bar" id="ban-filters"></div>
            <div class="char-grid" id="ban-char-grid"></div>
          </div>
        </div>`;

      renderBanSlots();
      renderBanGrid();
    }

    function renderBanSlots() {
      const container = document.getElementById('ban-slots');
      if (!container) return;

      let html = '';
      for (let i = 0; i < banCount; i++) {
        if (bannedChars[i]) {
          const c = allChars.find(ch => ch.id === bannedChars[i]);
          html += `
            <div class="ban-slot filled">
              <img class="ban-slot__img" src="${c?.image || ''}" alt="${c?.name || ''}" onerror="this.style.display='none'" />
              <span class="ban-slot__name">${c?.name || 'Unknown'}</span>
              <button class="ban-slot__remove" onclick="removeBan(${i})">&times;</button>
            </div>`;
        } else {
          html += `
            <div class="ban-slot">
              <span class="ban-slot__empty">Ban slot ${i + 1}</span>
            </div>`;
        }
      }
      container.innerHTML = html;

      const countEl = document.getElementById('ban-count-display');
      if (countEl) countEl.textContent = bannedChars.length;

      const btn = document.getElementById('submit-bans-btn');
      if (btn) btn.disabled = bannedChars.length < banCount;
    }

    function renderBanGrid() {
      const grid = document.getElementById('ban-char-grid');
      const filterBar = document.getElementById('ban-filters');

      filterBar.innerHTML = `
        <input type="search" placeholder="Search characters..." id="ban-search" />
        <div class="element-filters">
          <button class="element-btn active" data-element="">ALL</button>
          <button class="element-btn" data-element="RED">R</button>
          <button class="element-btn" data-element="BLU">B</button>
          <button class="element-btn" data-element="GRN">G</button>
          <button class="element-btn" data-element="YEL">Y</button>
          <button class="element-btn" data-element="PUR">P</button>
          <button class="element-btn" data-element="LGT">L</button>
        </div>
        <select id="ban-rarity-filter" class="rarity-select">
          <option value="">All Rarities</option>
          <option value="LEGEND">Legend</option>
          <option value="ULTRA">Ultra</option>
          <option value="SPARKING">Sparking</option>
          <option value="EXTREME">Extreme</option>
          <option value="HERO">Hero</option>
        </select>
      `;

      filterBar.querySelector('#ban-search').addEventListener('input', applyBanFilters);
      filterBar.querySelector('#ban-rarity-filter').addEventListener('change', applyBanFilters);
      filterBar.querySelectorAll('.element-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          filterBar.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyBanFilters();
        });
      });

      applyBanFilters();
    }

    function applyBanFilters() {
      const search = document.getElementById('ban-search')?.value || '';
      const element = document.querySelector('#ban-filters .element-btn.active')?.dataset.element || '';
      const rarity = document.getElementById('ban-rarity-filter')?.value || '';

      let chars = allChars;
      if (search) chars = chars.filter(c => c.name.toLowerCase().includes(search.toLowerCase()));
      if (element) chars = chars.filter(c => c.element === element);
      if (rarity) chars = chars.filter(c => c.rarity === rarity);

      const grid = document.getElementById('ban-char-grid');
      grid.innerHTML = '';

      const fallbackImg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23161d2e' width='100' height='100'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='%238fa0c4' font-size='12'%3E%3F%3C/text%3E%3C/svg%3E";
      const elementColors = {
        RED: 'var(--el-red)', BLU: 'var(--el-blu)', GRN: 'var(--el-grn)',
        YEL: 'var(--el-yel)', PUR: 'var(--el-pur)', LGT: 'var(--el-lgt)'
      };

      chars.forEach(c => {
        const card = document.createElement('div');
        const isBanned = bannedChars.includes(c.id);
        card.className = 'char-card' + (isBanned ? ' ban-selected' : '');

        const rarityClass = (c.rarity || '').toLowerCase();
        card.innerHTML = `
          <div class="char-card__art">
            <img src="${c.image}" alt="${c.name}" loading="lazy" onerror="this.src='${fallbackImg}'" />
            <div class="char-card__element" style="background:${elementColors[c.element] || '#666'}"></div>
            <span class="char-card__rarity badge-${rarityClass}">${c.rarity}</span>
          </div>
          <div class="char-card__body">
            <div class="char-card__name">${c.name}</div>
          </div>
        `;

        card.addEventListener('click', () => toggleBan(c.id));
        grid.appendChild(card);
      });
    }

    function toggleBan(charId) {
      const idx = bannedChars.indexOf(charId);
      if (idx !== -1) {
        bannedChars.splice(idx, 1);
      } else if (bannedChars.length < banCount) {
        bannedChars.push(charId);
        playSound('click');
      } else {
        NotificationSystem.show(`You can only ban ${banCount} characters`, 'error');
        return;
      }
      renderBanSlots();
      applyBanFilters();
    }

    function removeBan(index) {
      bannedChars.splice(index, 1);
      renderBanSlots();
      applyBanFilters();
    }

    async function submitBans() {
      if (bannedChars.length < banCount) return;
      if (!mySignup) return;

      const btn = document.getElementById('submit-bans-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      try {
        await db.updateSignupBans(mySignup.id, bannedChars);
        mySignup.bans = bannedChars;
        playSound('ko');
        NotificationSystem.show('Bans submitted!', 'success');
        showAlreadyBanned();
      } catch (e) {
        NotificationSystem.show('Error: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Confirm Bans';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
